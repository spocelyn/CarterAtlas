<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas 2.0 - Space Invaders</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: linear-gradient(135deg, #0b0b12, #141427, #1a1330);
  --border: rgba(168, 85, 247, 0.25);
  --text: #ffffff;
  --accent1: #a855f7;
  --accent2: #6366f1;
}
body {
  font-family: "DM Sans", system-ui, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 30px;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}
body::before {
  content: "";
  position: absolute;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(168,85,247,0.25), transparent 70%);
  filter: blur(100px);
  animation: floatGlow 6s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes floatGlow {
  from { transform: translate(-50px, -50px); }
  to { transform: translate(50px, 50px); }
}
.title {
  font-size: 2.5rem;
  font-weight: 800;
  letter-spacing: 1px;
  opacity: 0.9;
}
.hint {
  font-size: 0.85rem;
  color: #a9a9c0;
  margin-top: -20px;
}
.launch-btn {
  position: relative;
  font-size: 2.3rem;
  font-weight: 800;
  padding: 32px 100px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--accent1);
  color: var(--text);
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 15px 50px rgba(0,0,0,0.5);
}
.launch-btn:hover {
  transform: translateY(-8px) scale(1.05);
  box-shadow: 0 25px 70px rgba(0,0,0,0.7);
  filter: brightness(1.15);
}
#game-container {
  display: none;
  width: 100vw;
  height: 100vh;
  background: #0b0b12;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 15px;
  z-index: 10;
  position: fixed;
  top: 0;
  left: 0;
}
.score-board {
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--accent1);
}
#canvas-wrap {
  position: relative;
  display: inline-block;
  line-height: 0;
}
canvas {
  border: 2px solid var(--border);
  box-shadow: 0 15px 50px rgba(168,85,247,0.3);
  background: black;
  height: 75vh;
  max-height: 600px;
  width: auto;
}
.overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: rgba(0,0,0,0.78);
}
.overlay-title {
  font-size: 2.2rem;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: 1px;
}
.overlay-score {
  font-size: 1.1rem;
  color: var(--accent1);
  font-weight: 700;
}
.play-again-btn {
  font-size: 1.1rem;
  font-weight: 800;
  padding: 14px 36px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--accent1);
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s ease;
}
.play-again-btn:hover {
  transform: translateY(-3px) scale(1.03);
  filter: brightness(1.15);
}
.back-btn {
  padding: 10px 20px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid var(--border);
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
}
.back-btn:hover { background: rgba(255, 255, 255, 0.2); }
.home-link {
  position: fixed;
  top: 15px;
  right: 20px;
  z-index: 10;
  color: var(--accent1);
  font-family: inherit;
  text-decoration: none;
  font-size: 14px;
}
</style>
</head>
<body>
<a class="home-link" href="index.html">&larr; Home</a>
<div class="title" id="splashTitle">Atlas 2.0</div>
<div class="hint" id="controlsHint">Arrow Keys: Move | Up Arrow / Space: Shoot (hold to fire)</div>
<button class="launch-btn" id="launchBtn">Launch</button>
<div id="game-container">
  <div class="score-board">
    Score: <span id="scoreVal">0</span> &nbsp;
    High Score: <span id="highScoreVal">0</span> &nbsp;
    Wave: <span id="waveVal">1</span>
  </div>
  <div id="canvas-wrap">
    <canvas width="600" height="600" id="game"></canvas>
    <div class="overlay" id="gameOverOverlay">
      <div class="overlay-title">GAME OVER</div>
      <div class="overlay-score" id="finalScoreText"></div>
      <button class="play-again-btn" id="playAgainBtn">Play Again</button>
    </div>
  </div>
  <div>
    <button class="back-btn" id="pauseBtn">Pause</button>
    <button class="back-btn" id="muteBtn">Mute</button>
    <button class="back-btn" id="backBtn">Exit Game</button>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const context = canvas.getContext('2d');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const finalScoreText = document.getElementById('finalScoreText');

let highScore = Number(localStorage.getItem('atlasSpaceInvadersHighScore')) || 0;
document.getElementById('highScoreVal').innerText = highScore;

let score = 0;
let wave = 1;
let waveJustCleared = 1;
let gameOver = false;
let paused = false;
let transitionTimer = 0;
const TRANSITION_FRAMES = 90;
let frameCount = 0;
let rAF = null;
const keys = {};

// --- SOUND ---
let audioCtx = null;
let muted = localStorage.getItem('atlasSoundMuted') === 'true';
function playBeep(freq, duration, type, volume) {
  if (muted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = volume || 0.15;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}
const sound = {
  shoot: () => playBeep(880, 0.08, 'square', 0.08),
  explode: () => playBeep(140, 0.15, 'sawtooth', 0.15),
  gameOver: () => playBeep(110, 0.6, 'sawtooth', 0.2),
  waveClear: () => playBeep(660, 0.35, 'triangle', 0.18)
};

// --- STARRY BACKGROUND ---
const stars = [];
for (let i = 0; i < 80; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5 + 0.5,
    twinkleOffset: Math.random() * Math.PI * 2
  });
}

const player = {
  width: 50,
  height: 24,
  x: 0,
  y: 0,
  speed: 6,
  color: '#a855f7'
};

const playerBullets = [];
let shootCooldown = 0;
const invaderBullets = [];

const invaderRows = 5;
const invaderCols = 8;
const invaderWidth = 40;
const invaderHeight = 28;
const invaderPadding = 14;
const totalInvaders = invaderRows * invaderCols;
const invaderColors = ['#ff4d6d', '#ffb703', '#8ecae6', '#90be6d', '#c77dff'];
let invaders = [];
let invaderDirection = 1;
let invaderBaseSpeed = 1.2;

const BOSS_WAVE_INTERVAL = 10;
let boss = null;
let bossesDefeated = 0;

function isBossWave(w) {
  return w % BOSS_WAVE_INTERVAL === 0;
}

function addScore(amount) {
  score += amount;
  document.getElementById('scoreVal').innerText = score;
  if (score > highScore) {
    highScore = score;
    document.getElementById('highScoreVal').innerText = highScore;
    localStorage.setItem('atlasSpaceInvadersHighScore', highScore);
  }
}

function spawnBoss() {
  const tier = wave / BOSS_WAVE_INTERVAL;
  const health = 20 + (tier - 1) * 10;
  boss = {
    width: 160,
    height: 80,
    x: canvas.width / 2 - 80,
    y: 60,
    health: health,
    maxHealth: health,
    direction: 1,
    speed: 2 + tier * 0.4,
    hitFlash: 0
  };
}

function spawnWave() {
  invaders = [];
  boss = null;
  playerBullets.length = 0;
  shootCooldown = 0;
  invaderBullets.length = 0;
  document.getElementById('waveVal').innerText = wave;

  if (isBossWave(wave)) {
    spawnBoss();
    return;
  }

  const totalWidth = invaderCols * (invaderWidth + invaderPadding) - invaderPadding;
  const startX = (canvas.width - totalWidth) / 2;
  for (let row = 0; row < invaderRows; row++) {
    for (let col = 0; col < invaderCols; col++) {
      invaders.push({
        x: startX + col * (invaderWidth + invaderPadding),
        y: 60 + row * (invaderHeight + invaderPadding),
        width: invaderWidth,
        height: invaderHeight,
        alive: true,
        color: invaderColors[row % invaderColors.length]
      });
    }
  }
  invaderDirection = 1;
  invaderBaseSpeed = (1.2 + (wave - 1) * 0.3) * (1 + bossesDefeated * 0.2);
}

function resetGame() {
  score = 0;
  wave = 1;
  bossesDefeated = 0;
  gameOver = false;
  paused = false;
  document.getElementById('pauseBtn').innerText = 'Pause';
  transitionTimer = 0;
  document.getElementById('scoreVal').innerText = score;
  gameOverOverlay.style.display = 'none';

  player.x = canvas.width / 2 - player.width / 2;
  player.y = canvas.height - 50;

  spawnWave();
}

function collides(a, b) {
  return a.x < b.x + b.width &&
         a.x + a.width > b.x &&
         a.y < b.y + b.height &&
         a.y + a.height > b.y;
}

function update() {
  if (gameOver || paused) return;

  if (transitionTimer > 0) {
    transitionTimer--;
    if (transitionTimer === 0) {
      spawnWave();
    }
    return;
  }

  if (keys['ArrowLeft']) player.x -= player.speed;
  if (keys['ArrowRight']) player.x += player.speed;
  if (player.x < 0) player.x = 0;
  if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

  if (shootCooldown > 0) shootCooldown--;
  if ((keys['ArrowUp'] || keys[' ']) && shootCooldown <= 0) {
    playerBullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 14 });
    shootCooldown = 6;
    sound.shoot();
  }

  for (let i = playerBullets.length - 1; i >= 0; i--) {
    playerBullets[i].y -= 11;
    if (playerBullets[i].y < 0) playerBullets.splice(i, 1);
  }

  if (boss) {
    updateBoss();
  } else {
    let hitEdge = false;
    let aliveCount = 0;
    const aliveRatio = invaders.filter(inv => inv.alive).length / totalInvaders;
    const effectiveSpeed = invaderBaseSpeed * (1 + (1 - aliveRatio) * 1.5);
    for (const inv of invaders) {
      if (!inv.alive) continue;
      aliveCount++;
      inv.x += effectiveSpeed * invaderDirection;
      if (inv.x <= 0 || inv.x + inv.width >= canvas.width) hitEdge = true;
    }
    if (hitEdge) {
      invaderDirection *= -1;
      for (const inv of invaders) {
        if (inv.alive) inv.y += 20;
      }
    }

    if (aliveCount === 0) {
      waveJustCleared = wave;
      wave++;
      transitionTimer = TRANSITION_FRAMES;
      sound.waveClear();
      return;
    }

    for (const inv of invaders) {
      if (inv.alive && inv.y + inv.height >= player.y) {
        triggerGameOver();
        return;
      }
    }

    if (Math.random() < 0.015 + wave * 0.002) {
      const shooters = invaders.filter(inv => inv.alive);
      if (shooters.length) {
        const shooter = shooters[Math.floor(Math.random() * shooters.length)];
        invaderBullets.push({
          x: shooter.x + shooter.width / 2 - 2,
          y: shooter.y + shooter.height,
          width: 4,
          height: 12
        });
      }
    }
  }

  for (let i = invaderBullets.length - 1; i >= 0; i--) {
    invaderBullets[i].y += 5;
    if (invaderBullets[i].y > canvas.height) {
      invaderBullets.splice(i, 1);
    }
  }

  if (boss) {
    for (let i = playerBullets.length - 1; i >= 0; i--) {
      if (collides(playerBullets[i], boss)) {
        playerBullets.splice(i, 1);
        boss.health--;
        boss.hitFlash = 6;
        sound.explode();
        addScore(5);
        if (boss.health <= 0) {
          addScore(200);
          bossesDefeated++;
          boss = null;
          waveJustCleared = wave;
          wave++;
          transitionTimer = TRANSITION_FRAMES;
          sound.waveClear();
          return;
        }
      }
    }
  } else {
    for (let i = playerBullets.length - 1; i >= 0; i--) {
      let hit = false;
      for (const inv of invaders) {
        if (inv.alive && collides(playerBullets[i], inv)) {
          inv.alive = false;
          hit = true;
          sound.explode();
          addScore(10);
          break;
        }
      }
      if (hit) playerBullets.splice(i, 1);
    }
  }

  for (let i = invaderBullets.length - 1; i >= 0; i--) {
    if (collides(invaderBullets[i], player)) {
      triggerGameOver();
      return;
    }
  }
}

function updateBoss() {
  boss.x += boss.speed * boss.direction;
  if (boss.x <= 0 || boss.x + boss.width >= canvas.width) {
    boss.direction *= -1;
  }
  if (boss.hitFlash > 0) boss.hitFlash--;

  if (Math.random() < 0.025 + wave * 0.001) {
    invaderBullets.push({
      x: boss.x + boss.width / 2 - 3,
      y: boss.y + boss.height,
      width: 5,
      height: 14
    });
  }
  if (Math.random() < 0.012) {
    invaderBullets.push({ x: boss.x + boss.width * 0.2, y: boss.y + boss.height, width: 5, height: 14 });
    invaderBullets.push({ x: boss.x + boss.width * 0.8, y: boss.y + boss.height, width: 5, height: 14 });
  }
}

function triggerGameOver() {
  gameOver = true;
  sound.gameOver();
  finalScoreText.innerText = 'Score: ' + score + ' | High Score: ' + highScore;
  gameOverOverlay.style.display = 'flex';
}

function drawShip() {
  context.save();
  context.shadowColor = player.color;
  context.shadowBlur = 12;
  context.fillStyle = player.color;
  context.beginPath();
  context.moveTo(player.x + player.width / 2, player.y);
  context.lineTo(player.x, player.y + player.height);
  context.lineTo(player.x + player.width, player.y + player.height);
  context.closePath();
  context.fill();
  context.restore();
}

function drawInvader(inv) {
  const x = inv.x, y = inv.y, w = inv.width, h = inv.height;
  context.fillStyle = inv.color;
  context.fillRect(x + w * 0.15, y + h * 0.25, w * 0.7, h * 0.5);
  context.fillRect(x + w * 0.25, y, w * 0.1, h * 0.25);
  context.fillRect(x + w * 0.65, y, w * 0.1, h * 0.25);
  context.fillRect(x, y + h * 0.75, w * 0.2, h * 0.25);
  context.fillRect(x + w * 0.8, y + h * 0.75, w * 0.2, h * 0.25);
  context.fillRect(x + w * 0.35, y + h * 0.75, w * 0.3, h * 0.25);
  context.fillStyle = '#05050a';
  context.fillRect(x + w * 0.3, y + h * 0.4, w * 0.12, h * 0.12);
  context.fillRect(x + w * 0.58, y + h * 0.4, w * 0.12, h * 0.12);
}

function drawBoss() {
  const cx = boss.x + boss.width / 2;
  const cy = boss.y + boss.height / 2;
  const flashColor = boss.hitFlash > 0 ? '#ffffff' : '#ff3860';

  context.save();
  context.shadowColor = '#ff3860';
  context.shadowBlur = 18;
  context.fillStyle = flashColor;

  // Saucer body
  context.beginPath();
  context.ellipse(cx, cy + boss.height * 0.15, boss.width / 2, boss.height * 0.35, 0, 0, Math.PI * 2);
  context.fill();

  // Dome on top
  context.beginPath();
  context.ellipse(cx, cy - boss.height * 0.15, boss.width * 0.22, boss.height * 0.28, 0, Math.PI, 0);
  context.fill();
  context.restore();

  // Row of lights along the saucer's rim
  context.fillStyle = '#ffeb3b';
  const lightCount = 7;
  for (let i = 0; i < lightCount; i++) {
    const lx = boss.x + (boss.width / (lightCount - 1)) * i;
    context.beginPath();
    context.arc(lx, cy + boss.height * 0.15, 4, 0, Math.PI * 2);
    context.fill();
  }

  const barWidth = boss.width;
  const barHeight = 10;
  const barX = boss.x;
  const barY = boss.y - 22;
  context.fillStyle = '#222';
  context.fillRect(barX, barY, barWidth, barHeight);
  context.fillStyle = '#ff2d55';
  context.fillRect(barX, barY, barWidth * (boss.health / boss.maxHealth), barHeight);
  context.strokeStyle = '#ffffff';
  context.lineWidth = 1;
  context.strokeRect(barX, barY, barWidth, barHeight);

  context.fillStyle = '#ffffff';
  context.font = '600 12px "DM Sans", sans-serif';
  context.textAlign = 'center';
  context.fillText('BOSS', boss.x + boss.width / 2, barY - 8);
}

function draw() {
  context.fillStyle = '#05050a';
  context.fillRect(0, 0, canvas.width, canvas.height);

  for (const s of stars) {
    const alpha = 0.4 + 0.4 * Math.sin(frameCount * 0.05 + s.twinkleOffset);
    context.fillStyle = 'rgba(255,255,255,' + alpha + ')';
    context.beginPath();
    context.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    context.fill();
  }

  drawShip();

  if (playerBullets.length) {
    context.save();
    context.shadowColor = '#ffffff';
    context.shadowBlur = 8;
    context.fillStyle = '#ffffff';
    for (const b of playerBullets) {
      context.fillRect(b.x, b.y, b.width, b.height);
    }
    context.restore();
  }

  if (boss) {
    drawBoss();
  } else {
    for (const inv of invaders) {
      if (!inv.alive) continue;
      drawInvader(inv);
    }
  }

  context.save();
  context.shadowColor = '#ff4d6d';
  context.shadowBlur = 6;
  context.fillStyle = '#ff4d6d';
  for (const b of invaderBullets) {
    context.fillRect(b.x, b.y, b.width, b.height);
  }
  context.restore();

  if (transitionTimer > 0) {
    const pulse = 0.85 + 0.15 * Math.sin(frameCount * 0.15);

    context.save();
    context.fillStyle = 'rgba(11, 11, 18, 0.8)';
    if (context.roundRect) {
      context.beginPath();
      context.roundRect(canvas.width / 2 - 220, canvas.height / 2 - 55, 440, 110, 18);
      context.fill();
    } else {
      context.fillRect(0, canvas.height / 2 - 55, canvas.width, 110);
    }

    context.textAlign = 'center';
    context.textBaseline = 'middle';

    context.shadowColor = '#a855f7';
    context.shadowBlur = 20 * pulse;
    context.fillStyle = '#c99bff';
    context.font = '800 34px "DM Sans", sans-serif';
    context.fillText('W A V E   ' + waveJustCleared + '   C L E A R E D', canvas.width / 2, canvas.height / 2 - 14);

    context.shadowBlur = 0;
    if (isBossWave(waveJustCleared + 1)) {
      context.fillStyle = '#ff2d55';
      context.font = '800 15px "DM Sans", sans-serif';
      context.fillText('⚠ BOSS INCOMING — WAVE ' + (waveJustCleared + 1) + ' ⚠', canvas.width / 2, canvas.height / 2 + 24);
    } else {
      context.fillStyle = '#a9a9c0';
      context.font = '600 15px "DM Sans", sans-serif';
      context.fillText('Get ready for wave ' + (waveJustCleared + 1) + '...', canvas.width / 2, canvas.height / 2 + 24);
    }
    context.restore();
  }

  if (paused) {
    context.fillStyle = 'rgba(0,0,0,0.65)';
    context.fillRect(0, canvas.height / 2 - 40, canvas.width, 80);
    context.fillStyle = '#ffffff';
    context.font = '800 32px "DM Sans", sans-serif';
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    context.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
  }
}

function loop() {
  rAF = requestAnimationFrame(loop);
  frameCount++;
  update();
  draw();
}

document.addEventListener('keydown', function(e) {
  if (document.getElementById('game-container').style.display !== 'flex') return;
  keys[e.key] = true;
  if (["ArrowLeft", "ArrowRight", "ArrowUp", " "].includes(e.key)) {
    e.preventDefault();
  }
});
document.addEventListener('keyup', function(e) {
  keys[e.key] = false;
});

function startGame() {
  document.getElementById('splashTitle').style.display = 'none';
  document.getElementById('controlsHint').style.display = 'none';
  document.getElementById('launchBtn').style.display = 'none';
  document.getElementById('game-container').style.display = 'flex';
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
  resetGame();
  if (rAF) cancelAnimationFrame(rAF);
  rAF = requestAnimationFrame(loop);
}

document.getElementById('launchBtn').addEventListener('click', startGame);

document.getElementById('playAgainBtn').addEventListener('click', function() {
  resetGame();
});

document.getElementById('backBtn').addEventListener('click', function() {
  cancelAnimationFrame(rAF);
  if (document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
  document.getElementById('game-container').style.display = 'none';
  document.getElementById('splashTitle').style.display = 'block';
  document.getElementById('controlsHint').style.display = 'block';
  document.getElementById('launchBtn').style.display = 'block';
});

document.getElementById('pauseBtn').addEventListener('click', function() {
  if (gameOver) return;
  paused = !paused;
  this.innerText = paused ? 'Resume' : 'Pause';
});
document.getElementById('muteBtn').innerText = muted ? 'Unmute' : 'Mute';
document.getElementById('muteBtn').addEventListener('click', function() {
  muted = !muted;
  localStorage.setItem('atlasSoundMuted', muted);
  this.innerText = muted ? 'Unmute' : 'Mute';
});
</script>
</body>
</html>
