<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Atlas 2.0 - Pong</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0b0b12, #141427, #1a1330);
            display: flex;
            align-items: center;
            justify-content  : center;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        canvas:focus {
            outline: none;
        }
        .home-link {
            position: fixed;
            top: 15px;
            right: 20px;
            z-index: 10;
            color: #a855f7;
            font-family: sans-serif;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<a class="home-link" href="index.html">&larr; Home</a>
<canvas id="game" tabindex="0"></canvas>

<script>
const canvas = document.getElementById('game');
const context = canvas.getContext('2d');
const grid = 15;
const paddleHeight = grid * 5;
var maxPaddleY;

// --- CONTROL SPEED ---
var ballSpeed = 11;
var paddleSpeed = 16;

// --- GAME MODE CONFIGURATION ---
var gameStarted = false;
var menuState = 'main'; // main, difficulty
var isTwoPlayerMode = false; // false = vs AI, true = 2 Players
var aiDifficulty = 'medium'; // easy, medium, hard
var paused = false;

// Score Tracking
var leftScore = 0;
var rightScore = 0;

// Button regions for mouse clicks
var btn1Player = { x: 0, y: 0, w: 200, h: 50 };
var btn2Player = { x: 0, y: 0, w: 200, h: 50 };
var btnEasy = { x: 0, y: 0, w: 150, h: 50 };
var btnMedium = { x: 0, y: 0, w: 150, h: 50 };
var btnHard = { x: 0, y: 0, w: 150, h: 50 };
var btnDifficultyBack = { x: 0, y: 0, w: 150, h: 40 };
var btnBack = { x: 20, y: 20, w: 100, h: 35 };
var btnPause = { x: 140, y: 20, w: 100, h: 35 };
var btnMute = { x: 260, y: 20, w: 100, h: 35 };

// --- PADDLES ---
const leftPaddle = {
  x: 0,
  y: 0,
  width: grid,
  height: paddleHeight,
  dy: 0,
  color: 'magenta' // Player 1 / AI Color
};
const rightPaddle = {
  x: 0,
  y: 0,
  width: grid,
  height: paddleHeight,
  dy: 0,
  color: 'cyan' // Player 2 Color
};

// --- BALL ---
const ball = {
  x: 0,
  y: 0,
  width: grid,
  height: grid,
  resetting: false,
  dx: ballSpeed,
  dy: -ballSpeed,
  color: 'white'
};

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  maxPaddleY = canvas.height - grid - paddleHeight;

  leftPaddle.x = grid * 2;
  rightPaddle.x = canvas.width - grid * 3;

  if (!ball.resetting) {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
  }

  leftPaddle.y = canvas.height / 2 - paddleHeight / 2;
  rightPaddle.y = canvas.height / 2 - paddleHeight / 2;

  // Dynamically position menu buttons
  var menuY = canvas.height / 2 + 20;

  btn1Player.x = canvas.width / 2 - 220;
  btn1Player.y = menuY;
  btn2Player.x = canvas.width / 2 + 20;
  btn2Player.y = menuY;

  var diffStartX = canvas.width / 2 - 255;
  btnEasy.x = diffStartX;
  btnEasy.y = menuY;
  btnMedium.x = diffStartX + 170;
  btnMedium.y = menuY;
  btnHard.x = diffStartX + 340;
  btnHard.y = menuY;
  btnDifficultyBack.x = canvas.width / 2 - 75;
  btnDifficultyBack.y = menuY + 80;
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {
      console.log(`Error attempting full-screen: ${err.message}`);
    });
  } else {
    document.exitFullscreen();
  }
}

function collides(obj1, obj2) {
  return obj1.x < obj2.x + obj2.width &&
         obj1.x + obj1.width > obj2.x &&
         obj1.y < obj2.y + obj2.height &&
         obj1.y + obj1.height > obj2.y;
}

// --- SOUND ---
var audioCtx = null;
var muted = localStorage.getItem('atlasSoundMuted') === 'true';
function playBeep(freq, duration, type, volume) {
  if (muted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = volume || 0.15;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}
const sound = {
  hit: () => playBeep(440, 0.07, 'square', 0.12),
  wall: () => playBeep(220, 0.06, 'square', 0.1),
  score: () => playBeep(140, 0.3, 'sawtooth', 0.18)
};

var maxBallSpeed = 24;
function speedUpBall() {
  const factor = 1.06;
  ball.dx *= factor;
  ball.dy *= factor;
  if (Math.abs(ball.dx) > maxBallSpeed) ball.dx = maxBallSpeed * Math.sign(ball.dx);
  if (Math.abs(ball.dy) > maxBallSpeed) ball.dy = maxBallSpeed * Math.sign(ball.dy);
}

const AI_SETTINGS = {
  easy:   { baseMultiplier: 0.68, fastMultiplier: 0.78, margin: 18 },
  medium: { baseMultiplier: 0.80, fastMultiplier: 0.95, margin: 12 },
  hard:   { baseMultiplier: 1.05, fastMultiplier: 1.20, margin: 4 }
};

function updateAI() {
  const settings = AI_SETTINGS[aiDifficulty];
  const paddleCenter = leftPaddle.y + (leftPaddle.height / 2);
  var activeAISpeed = paddleSpeed * settings.baseMultiplier;

  if (Math.abs(ball.dx) > 16) {
    activeAISpeed = paddleSpeed * settings.fastMultiplier;
  }

  if (paddleCenter < ball.y - settings.margin) {
    leftPaddle.dy = activeAISpeed;
  } else if (paddleCenter > ball.y + settings.margin) {
    leftPaddle.dy = -activeAISpeed;
  } else {
    leftPaddle.dy = 0;
  }
}

function loop() {
  requestAnimationFrame(loop);
  context.clearRect(0,0,canvas.width,canvas.height);

  if (!gameStarted && menuState === 'main') {
    // Main Menu Screen
    context.save();
    context.shadowColor = '#a855f7';
    context.shadowBlur = 16;
    context.fillStyle = '#c99bff';
    context.font = '800 32px "DM Sans", sans-serif';
    context.textAlign = 'center';
    context.fillText('SELECT GAME MODE', canvas.width / 2, canvas.height / 2 - 60);
    context.restore();

    context.fillStyle = 'white';
    context.font = '14px monospace';
    context.textAlign = 'center';
    context.fillText('PRESS SPACEBAR TO TOGGLE FULLSCREEN', canvas.width / 2, canvas.height / 2 - 20);

    // 1 Player Button
    context.fillStyle = '#1a1330';
    context.fillRect(btn1Player.x, btn1Player.y, btn1Player.w, btn1Player.h);
    context.strokeStyle = '#a855f7';
    context.lineWidth = 2;
    context.strokeRect(btn1Player.x, btn1Player.y, btn1Player.w, btn1Player.h);
    context.fillStyle = 'white';
    context.font = '18px monospace';
    context.fillText('1 PLAYER (VS AI)', btn1Player.x + btn1Player.w / 2, btn1Player.y + 32);

    // 2 Player Button
    context.fillStyle = '#1a1330';
    context.fillRect(btn2Player.x, btn2Player.y, btn2Player.w, btn2Player.h);
    context.strokeRect(btn2Player.x, btn2Player.y, btn2Player.w, btn2Player.h);
    context.fillStyle = 'white';
    context.fillText('2 PLAYERS (LOCAL)', btn2Player.x + btn2Player.w / 2, btn2Player.y + 32);

    // Controls Info
    context.fillStyle = 'darkgrey';
    context.font = '14px monospace';
    context.fillText('P1: W/S Keys | P2: Arrow Keys', canvas.width / 2, canvas.height / 2 + 110);
    return;
  }

  if (!gameStarted && menuState === 'difficulty') {
    // Difficulty Select Screen
    context.save();
    context.shadowColor = '#a855f7';
    context.shadowBlur = 16;
    context.fillStyle = '#c99bff';
    context.font = '800 32px "DM Sans", sans-serif';
    context.textAlign = 'center';
    context.fillText('SELECT DIFFICULTY', canvas.width / 2, canvas.height / 2 - 60);
    context.restore();
    context.textAlign = 'center';

    // Easy Button
    context.fillStyle = '#1a1330';
    context.fillRect(btnEasy.x, btnEasy.y, btnEasy.w, btnEasy.h);
    context.strokeStyle = '#a855f7';
    context.lineWidth = 2;
    context.strokeRect(btnEasy.x, btnEasy.y, btnEasy.w, btnEasy.h);
    context.fillStyle = 'white';
    context.font = '16px monospace';
    context.fillText('EASY', btnEasy.x + btnEasy.w / 2, btnEasy.y + 32);

    // Medium Button
    context.fillStyle = '#1a1330';
    context.fillRect(btnMedium.x, btnMedium.y, btnMedium.w, btnMedium.h);
    context.strokeRect(btnMedium.x, btnMedium.y, btnMedium.w, btnMedium.h);
    context.fillStyle = 'white';
    context.fillText('MEDIUM', btnMedium.x + btnMedium.w / 2, btnMedium.y + 32);

    // Hard Button
    context.fillStyle = '#1a1330';
    context.fillRect(btnHard.x, btnHard.y, btnHard.w, btnHard.h);
    context.strokeRect(btnHard.x, btnHard.y, btnHard.w, btnHard.h);
    context.fillStyle = 'white';
    context.fillText('HARD', btnHard.x + btnHard.w / 2, btnHard.y + 32);

    // Back Button
    context.fillStyle = '#222';
    context.fillRect(btnDifficultyBack.x, btnDifficultyBack.y, btnDifficultyBack.w, btnDifficultyBack.h);
    context.strokeStyle = '#a855f7';
    context.lineWidth = 1;
    context.strokeRect(btnDifficultyBack.x, btnDifficultyBack.y, btnDifficultyBack.w, btnDifficultyBack.h);
    context.fillStyle = 'white';
    context.font = '14px monospace';
    context.fillText('← BACK', btnDifficultyBack.x + btnDifficultyBack.w / 2, btnDifficultyBack.y + 25);
    return;
  }

  if (!paused) {
    // Input Handling
    if (keys['ArrowUp']) {
      rightPaddle.dy = -paddleSpeed;
    } else if (keys['ArrowDown']) {
      rightPaddle.dy = paddleSpeed;
    } else {
      rightPaddle.dy = 0;
    }

    if (isTwoPlayerMode) {
      if (keys['w'] || keys['W']) {
        leftPaddle.dy = -paddleSpeed;
      } else if (keys['s'] || keys['S']) {
        leftPaddle.dy = paddleSpeed;
      } else {
        leftPaddle.dy = 0;
      }
    } else {
      updateAI();
    }

    leftPaddle.y += leftPaddle.dy;
    rightPaddle.y += rightPaddle.dy;

    if (leftPaddle.y < grid) leftPaddle.y = grid;
    else if (leftPaddle.y > maxPaddleY) leftPaddle.y = maxPaddleY;

    if (rightPaddle.y < grid) rightPaddle.y = grid;
    else if (rightPaddle.y > maxPaddleY) rightPaddle.y = maxPaddleY;
  }

  // Draw Paddles
  context.fillStyle = leftPaddle.color;
  context.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);
  context.fillStyle = rightPaddle.color;
  context.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);

  if (!paused) {
    // Ball Movement
    ball.x += ball.dx;
    ball.y += ball.dy;

    if (ball.y < grid) {
      ball.y = grid;
      ball.dy *= -1;
      sound.wall();
    }
    else if (ball.y + grid > canvas.height - grid) {
      ball.y = canvas.height - grid * 2;
      ball.dy *= -1;
      sound.wall();
    }

    // Scoring
    if ((ball.x < 0 || ball.x > canvas.width) && !ball.resetting) {
      ball.resetting = true;
      if (ball.x < 0) rightScore++;
      else leftScore++;
      sound.score();

      setTimeout(() => {
        ball.resetting = false;
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.dx = (ball.dx < 0) ? ballSpeed : -ballSpeed;
        ball.dy = (ball.dy < 0) ? ballSpeed : -ballSpeed;
        ball.color = 'white';
      }, 400);
    }

    // Collisions
    if (collides(ball, leftPaddle)) {
      ball.dx *= -1;
      ball.x = leftPaddle.x + leftPaddle.width;
      ball.color = leftPaddle.color;
      speedUpBall();
      sound.hit();
    }
    else if (collides(ball, rightPaddle)) {
      ball.dx *= -1;
      ball.x = rightPaddle.x - ball.width;
      ball.color = rightPaddle.color;
      speedUpBall();
      sound.hit();
    }
  }

  // Draw Ball
  context.fillStyle = ball.color;
  context.fillRect(ball.x, ball.y, ball.width, ball.height);

  // Top and bottom walls split down the middle
  context.fillStyle = leftPaddle.color;
  context.fillRect(0, 0, canvas.width / 2, grid);
  context.fillRect(0, canvas.height - grid, canvas.width / 2, grid);

  context.fillStyle = rightPaddle.color;
  context.fillRect(canvas.width / 2, 0, canvas.width / 2, grid);
  context.fillRect(canvas.width / 2, canvas.height - grid, canvas.width / 2, grid);

  // Center net split down the middle
  for (let i = grid; i < canvas.height - grid; i += grid * 2) {
    context.fillStyle = leftPaddle.color;
    context.fillRect(canvas.width / 2 - grid, i, grid / 2, grid);

    context.fillStyle = rightPaddle.color;
    context.fillRect(canvas.width / 2, i, grid / 2, grid);
  }

  // Draw Scores
  context.fillStyle = 'white';
  context.font = '48px monospace';
  context.textAlign = 'center';
  context.fillText(leftScore, canvas.width / 4, grid * 5);
  context.fillText(rightScore, (canvas.width / 2) * 1.5, grid * 5);

  if (!isTwoPlayerMode) {
    context.fillStyle = 'darkgrey';
    context.font = '13px monospace';
    context.fillText('AI: ' + aiDifficulty.toUpperCase(), canvas.width / 2, 55);
  }

  // Draw Back Button
  context.fillStyle = '#222';
  context.fillRect(btnBack.x, btnBack.y, btnBack.w, btnBack.h);
  context.strokeStyle = '#a855f7';
  context.lineWidth = 1;
  context.strokeRect(btnBack.x, btnBack.y, btnBack.w, btnBack.h);
  context.fillStyle = 'white';
  context.font = '14px monospace';
  context.textAlign = 'center';
  context.fillText('← BACK', btnBack.x + btnBack.w / 2, btnBack.y + 22);

  // Draw Pause Button
  context.fillStyle = '#222';
  context.fillRect(btnPause.x, btnPause.y, btnPause.w, btnPause.h);
  context.strokeStyle = '#a855f7';
  context.lineWidth = 1;
  context.strokeRect(btnPause.x, btnPause.y, btnPause.w, btnPause.h);
  context.fillStyle = 'white';
  context.font = '14px monospace';
  context.textAlign = 'center';
  context.fillText(paused ? '▶ RESUME' : '❙❙ PAUSE', btnPause.x + btnPause.w / 2, btnPause.y + 22);

  // Draw Mute Button
  context.fillStyle = '#222';
  context.fillRect(btnMute.x, btnMute.y, btnMute.w, btnMute.h);
  context.strokeStyle = '#a855f7';
  context.lineWidth = 1;
  context.strokeRect(btnMute.x, btnMute.y, btnMute.w, btnMute.h);
  context.fillStyle = 'white';
  context.font = '14px monospace';
  context.textAlign = 'center';
  context.fillText(muted ? 'UNMUTE' : 'MUTE', btnMute.x + btnMute.w / 2, btnMute.y + 22);

  if (paused) {
    context.fillStyle = 'rgba(0,0,0,0.6)';
    context.fillRect(0, canvas.height / 2 - 40, canvas.width, 80);
    context.fillStyle = 'white';
    context.font = '32px monospace';
    context.textAlign = 'center';
    context.fillText('PAUSED', canvas.width / 2, canvas.height / 2 + 10);
  }
}

const keys = {};

document.addEventListener('keydown', function(e) {
  keys[e.key] = true;
  if (["ArrowUp", "ArrowDown", "w", "W", "s", "S", " "].includes(e.key)) {
    e.preventDefault();
  }
  if (e.key === " ") toggleFullscreen();
});

document.addEventListener('keyup', function(e) {
  keys[e.key] = false;
});

window.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  if (!gameStarted && menuState === 'main') {
    if (mouseX >= btn1Player.x && mouseX <= btn1Player.x + btn1Player.w &&
        mouseY >= btn1Player.y && mouseY <= btn1Player.y + btn1Player.h) {
      menuState = 'difficulty';
      canvas.focus();
    }
    else if (mouseX >= btn2Player.x && mouseX <= btn2Player.x + btn2Player.w &&
             mouseY >= btn2Player.y && mouseY <= btn2Player.y + btn2Player.h) {
      isTwoPlayerMode = true;
      gameStarted = true;
      canvas.focus();
    }
  } else if (!gameStarted && menuState === 'difficulty') {
    if (mouseX >= btnEasy.x && mouseX <= btnEasy.x + btnEasy.w &&
        mouseY >= btnEasy.y && mouseY <= btnEasy.y + btnEasy.h) {
      isTwoPlayerMode = false;
      aiDifficulty = 'easy';
      gameStarted = true;
      canvas.focus();
    }
    else if (mouseX >= btnMedium.x && mouseX <= btnMedium.x + btnMedium.w &&
             mouseY >= btnMedium.y && mouseY <= btnMedium.y + btnMedium.h) {
      isTwoPlayerMode = false;
      aiDifficulty = 'medium';
      gameStarted = true;
      canvas.focus();
    }
    else if (mouseX >= btnHard.x && mouseX <= btnHard.x + btnHard.w &&
             mouseY >= btnHard.y && mouseY <= btnHard.y + btnHard.h) {
      isTwoPlayerMode = false;
      aiDifficulty = 'hard';
      gameStarted = true;
      canvas.focus();
    }
    else if (mouseX >= btnDifficultyBack.x && mouseX <= btnDifficultyBack.x + btnDifficultyBack.w &&
             mouseY >= btnDifficultyBack.y && mouseY <= btnDifficultyBack.y + btnDifficultyBack.h) {
      menuState = 'main';
      canvas.focus();
    }
  } else {
    if (mouseX >= btnBack.x && mouseX <= btnBack.x + btnBack.w &&
        mouseY >= btnBack.y && mouseY <= btnBack.y + btnBack.h) {
      gameStarted = false;
      menuState = 'main';
      leftScore = 0;
      rightScore = 0;
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.color = 'white';
      paused = false;
      canvas.focus();
    }
    else if (mouseX >= btnPause.x && mouseX <= btnPause.x + btnPause.w &&
             mouseY >= btnPause.y && mouseY <= btnPause.y + btnPause.h) {
      paused = !paused;
      canvas.focus();
    }
    else if (mouseX >= btnMute.x && mouseX <= btnMute.x + btnMute.w &&
             mouseY >= btnMute.y && mouseY <= btnMute.y + btnMute.h) {
      muted = !muted;
      localStorage.setItem('atlasSoundMuted', muted);
      canvas.focus();
    }
  }
});

resizeCanvas();
window.addEventListener('resize', resizeCanvas);
document.addEventListener('fullscreenchange', resizeCanvas);

canvas.focus();
requestAnimationFrame(loop);
</script>
</body>
</html>
