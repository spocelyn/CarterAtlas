<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pong Game - 1 or 2 Players</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: black;
            display: flex;
            align-items: center;
            justify-content  : center;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        canvas:focus {
            outline: none;
        }
        .home-link {
            position: fixed;
            top: 15px;
            right: 20px;
            z-index: 10;
            color: #a855f7;
            font-family: sans-serif;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<a class="home-link" href="index.html">&larr; Home</a>
<canvas id="game" tabindex="0"></canvas>

<script>
const canvas = document.getElementById('game');
const context = canvas.getContext('2d');
const grid = 15;
const paddleHeight = grid * 5;
var maxPaddleY;

// --- CONTROL SPEED ---
var ballSpeed = 11;
var paddleSpeed = 16;

// --- GAME MODE CONFIGURATION ---
var gameStarted = false;
var isTwoPlayerMode = false; // false = vs AI, true = 2 Players

// Score Tracking
var leftScore = 0;
var rightScore = 0;

// Button regions for mouse clicks
var btn1Player = { x: 0, y: 0, w: 200, h: 50 };
var btn2Player = { x: 0, y: 0, w: 200, h: 50 };
var btnBack = { x: 20, y: 20, w: 100, h: 35 };

// --- PADDLES ---
const leftPaddle = {
  x: 0,
  y: 0,
  width: grid,
  height: paddleHeight,
  dy: 0,
  color: 'magenta' // Player 1 / AI Color
};
const rightPaddle = {
  x: 0,
  y: 0,
  width: grid,
  height: paddleHeight,
  dy: 0,
  color: 'cyan' // Player 2 Color
};

// --- BALL ---
const ball = {
  x: 0,
  y: 0,
  width: grid,
  height: grid,
  resetting: false,
  dx: ballSpeed,
  dy: -ballSpeed,
  color: 'white'
};

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  maxPaddleY = canvas.height - grid - paddleHeight;

  leftPaddle.x = grid * 2;
  rightPaddle.x = canvas.width - grid * 3;

  if (!ball.resetting) {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
  }

  leftPaddle.y = canvas.height / 2 - paddleHeight / 2;
  rightPaddle.y = canvas.height / 2 - paddleHeight / 2;

  // Dynamically position menu buttons
  btn1Player.x = canvas.width / 2 - 220;
  btn1Player.y = canvas.height / 2 + 20;
  btn2Player.x = canvas.width / 2 + 20;
  btn2Player.y = canvas.height / 2 + 20;
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {
      console.log(`Error attempting full-screen: ${err.message}`);
    });
  } else {
    document.exitFullscreen();
  }
}

function collides(obj1, obj2) {
  return obj1.x < obj2.x + obj2.width &&
         obj1.x + obj1.width > obj2.x &&
         obj1.y < obj2.y + obj2.height &&
         obj1.y + obj1.height > obj2.y;
}

function updateAI() {
  const paddleCenter = leftPaddle.y + (leftPaddle.height / 2);
  var activeAISpeed = paddleSpeed * 0.65;

  if (Math.abs(ball.dx) > 16) {
    activeAISpeed = paddleSpeed * 0.85;
  }

  if (paddleCenter < ball.y - 15) {
    leftPaddle.dy = activeAISpeed;
  } else if (paddleCenter > ball.y + 15) {
    leftPaddle.dy = -activeAISpeed;
  } else {
    leftPaddle.dy = 0;
  }
}

function loop() {
  requestAnimationFrame(loop);
  context.clearRect(0,0,canvas.width,canvas.height);

  if (!gameStarted) {
    // Menu Screen
    context.fillStyle = 'white';
    context.font = '32px monospace';
    context.textAlign = 'center';
    context.fillText('SELECT GAME MODE', canvas.width / 2, canvas.height / 2 - 60);

    context.font = '14px monospace';
    context.fillText('PRESS SPACEBAR TO TOGGLE FULLSCREEN', canvas.width / 2, canvas.height / 2 - 20);

    // 1 Player Button
    context.fillStyle = '#333';
    context.fillRect(btn1Player.x, btn1Player.y, btn1Player.w, btn1Player.h);
    context.strokeStyle = 'white';
    context.lineWidth = 2;
    context.strokeRect(btn1Player.x, btn1Player.y, btn1Player.w, btn1Player.h);
    context.fillStyle = 'white';
    context.font = '18px monospace';
    context.fillText('1 PLAYER (VS AI)', btn1Player.x + btn1Player.w / 2, btn1Player.y + 32);

    // 2 Player Button
    context.fillStyle = '#333';
    context.fillRect(btn2Player.x, btn2Player.y, btn2Player.w, btn2Player.h);
    context.strokeRect(btn2Player.x, btn2Player.y, btn2Player.w, btn2Player.h);
    context.fillStyle = 'white';
    context.fillText('2 PLAYERS (LOCAL)', btn2Player.x + btn2Player.w / 2, btn2Player.y + 32);

    // Controls Info
    context.fillStyle = 'darkgrey';
    context.font = '14px monospace';
    context.fillText('P1: W/S Keys | P2: Arrow Keys', canvas.width / 2, canvas.height / 2 + 110);
    return;
  }

  // Input Handling
  if (keys['ArrowUp']) {
    rightPaddle.dy = -paddleSpeed;
  } else if (keys['ArrowDown']) {
    rightPaddle.dy = paddleSpeed;
  } else {
    rightPaddle.dy = 0;
  }

  if (isTwoPlayerMode) {
    if (keys['w'] || keys['W']) {
      leftPaddle.dy = -paddleSpeed;
    } else if (keys['s'] || keys['S']) {
      leftPaddle.dy = paddleSpeed;
    } else {
      leftPaddle.dy = 0;
    }
  } else {
    updateAI();
  }

  leftPaddle.y += leftPaddle.dy;
  rightPaddle.y += rightPaddle.dy;

  if (leftPaddle.y < grid) leftPaddle.y = grid;
  else if (leftPaddle.y > maxPaddleY) leftPaddle.y = maxPaddleY;

  if (rightPaddle.y < grid) rightPaddle.y = grid;
  else if (rightPaddle.y > maxPaddleY) rightPaddle.y = maxPaddleY;

  // Draw Paddles
  context.fillStyle = leftPaddle.color;
  context.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);
  context.fillStyle = rightPaddle.color;
  context.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);

  // Ball Movement
  ball.x += ball.dx;
  ball.y += ball.dy;

  if (ball.y < grid) {
    ball.y = grid;
    ball.dy *= -1;
  }
  else if (ball.y + grid > canvas.height - grid) {
    ball.y = canvas.height - grid * 2;
    ball.dy *= -1;
  }

  // Scoring
  if ((ball.x < 0 || ball.x > canvas.width) && !ball.resetting) {
    ball.resetting = true;
    if (ball.x < 0) rightScore++;
    else leftScore++;

    setTimeout(() => {
      ball.resetting = false;
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.dx = (ball.dx < 0) ? ballSpeed : -ballSpeed;
      ball.dy = (ball.dy < 0) ? ballSpeed : -ballSpeed;
      ball.color = 'white';
    }, 400);
  }

  // Collisions (Speed updates removed)
  if (collides(ball, leftPaddle)) {
    ball.dx *= -1;
    ball.x = leftPaddle.x + leftPaddle.width;
    ball.color = leftPaddle.color;
  }
  else if (collides(ball, rightPaddle)) {
    ball.dx *= -1;
    ball.x = rightPaddle.x - ball.width;
    ball.color = rightPaddle.color;
  }

  // Draw Ball
  context.fillStyle = ball.color;
  context.fillRect(ball.x, ball.y, ball.width, ball.height);

  // Top and bottom walls split down the middle
  context.fillStyle = leftPaddle.color;
  context.fillRect(0, 0, canvas.width / 2, grid);
  context.fillRect(0, canvas.height - grid, canvas.width / 2, grid);

  context.fillStyle = rightPaddle.color;
  context.fillRect(canvas.width / 2, 0, canvas.width / 2, grid);
  context.fillRect(canvas.width / 2, canvas.height - grid, canvas.width / 2, grid);

  // Center net split down the middle
  for (let i = grid; i < canvas.height - grid; i += grid * 2) {
    context.fillStyle = leftPaddle.color;
    context.fillRect(canvas.width / 2 - grid, i, grid / 2, grid);

    context.fillStyle = rightPaddle.color;
    context.fillRect(canvas.width / 2, i, grid / 2, grid);
  }

  // Draw Scores
  context.fillStyle = 'white';
  context.font = '48px monospace';
  context.textAlign = 'center';
  context.fillText(leftScore, canvas.width / 4, grid * 5);
  context.fillText(rightScore, (canvas.width / 2) * 1.5, grid * 5);

  // Draw Back Button
  context.fillStyle = '#222';
  context.fillRect(btnBack.x, btnBack.y, btnBack.w, btnBack.h);
  context.strokeStyle = 'white';
  context.lineWidth = 1;
  context.strokeRect(btnBack.x, btnBack.y, btnBack.w, btnBack.h);
  context.fillStyle = 'white';
  context.font = '14px monospace';
  context.textAlign = 'center';
  context.fillText('← BACK', btnBack.x + btnBack.w / 2, btnBack.y + 22);
}

const keys = {};

document.addEventListener('keydown', function(e) {
  keys[e.key] = true;
  if (["ArrowUp", "ArrowDown", "w", "W", "s", "S", " "].includes(e.key)) {
    e.preventDefault();
  }
  if (e.key === " ") toggleFullscreen();
});

document.addEventListener('keyup', function(e) {
  keys[e.key] = false;
});

window.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  if (!gameStarted) {
    if (mouseX >= btn1Player.x && mouseX <= btn1Player.x + btn1Player.w &&
        mouseY >= btn1Player.y && mouseY <= btn1Player.y + btn1Player.h) {
      isTwoPlayerMode = false;
      gameStarted = true;
      canvas.focus();
    }
    else if (mouseX >= btn2Player.x && mouseX <= btn2Player.x + btn2Player.w &&
             mouseY >= btn2Player.y && mouseY <= btn2Player.y + btn2Player.h) {
      isTwoPlayerMode = true;
      gameStarted = true;
      canvas.focus();
    }
  } else {
    if (mouseX >= btnBack.x && mouseX <= btnBack.x + btnBack.w &&
        mouseY >= btnBack.y && mouseY <= btnBack.y + btnBack.h) {
      gameStarted = false;
      leftScore = 0;
      rightScore = 0;
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.color = 'white';
      canvas.focus();
    }
  }
});

resizeCanvas();
window.addEventListener('resize', resizeCanvas);
document.addEventListener('fullscreenchange', resizeCanvas);

canvas.focus();
requestAnimationFrame(loop);
</script>
</body>
</html>
